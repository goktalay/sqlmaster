<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>SQL Master</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="conn.css">
</head>
<body>
  <div class="cw">
    <header class="site-bar">
      <span class="status-dot" id="dot"></span>
      <div class="site-title">
        <span class="site-name" id="cwName"></span>
        <span class="site-sub" id="cwSub"></span>
      </div>
      <span class="tag prov" id="cwProv"></span>
      <button class="badge-ro" id="cwRo"></button>
      <div class="bar-actions">
        <button class="btn sm" id="btnNewSql"></button>
        <button class="btn sm" id="btnBuilder"></button>
        <button class="btn sm" id="btnReport"></button>
        <button class="btn sm ghost" id="btnReconnect"></button>
        <button class="icon-btn" id="btnTheme"></button>
        <button class="icon-btn" id="btnSettings"></button>
      </div>
    </header>
    <div class="cw-body">
      <aside class="cw-tree" id="treeHost"></aside>
      <div class="vsplit" id="treeSplit"></div>
      <section class="cw-main">
        <div class="tabbar" id="tabbar"></div>
        <div class="tab-host" id="tabHost"></div>
      </section>
    </div>
    <footer class="status-bar">
      <span id="stServer"></span>
      <span class="sep"></span>
      <span id="stDb"></span>
      <span class="grow"></span>
      <span id="stMsg"></span>
    </footer>
  </div>
  <script src="conn.js"></script>
</body>
</html>
