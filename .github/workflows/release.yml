# Windows exe'lerini derler.
# - "v1.2.3" gibi bir etiket gönderilince: sürümü etiketten alır, derler ve GitHub Release'e ekler,
#   ardından sqlmaster.app'e (Mastertool) yükler.
# - Actions sekmesinden elle çalıştırılınca (workflow_dispatch): yalnızca derler, exe'leri "artifact" olarak saklar.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Exe'leri derle
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: SQL-Master-windows
          path: dist/*.exe
          retention-days: 14

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      # Exe kullanıcılara ayrıca Mastertool hesabındaki kişiye özel bağlantıyla dağıtılır.
      # Anahtar depo secret'ı SQLM_RELEASE_KEY'dedir (kullanıcı ekler); tanımlı değilse adım atlanır.
      # Ayrıntılar scripts/upload-sqlmaster.sh.
      - name: sqlmaster.app'e yükle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SQLM_RELEASE_KEY: ${{ secrets.SQLM_RELEASE_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          bash scripts/upload-sqlmaster.sh "$V" "dist/SQL-Master-Setup-$V.exe" "$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")" "dist/SQL-Master-Portable-$V.exe"
